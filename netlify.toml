[build]
  command = "npm run build && node scripts/write-staging-headers.mjs"
  publish = "dist"

# Keep the published URLs without trailing slashes; the matching HTML files
# are still served by the explicit rewrites below.
[build.processing.html]
  pretty_urls = false

# Keep established Wix URLs working when the website moves to Netlify.
# Published /post/<slug> URLs and /blog already keep their existing paths.
[[redirects]]
  from = "/about-5"
  to = "/about"
  status = 301

[[redirects]]
  from = "/book-online"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/blog/categories/autism-awareness"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/service-page/entrepreneur-disc-assessment-debrief"
  to = "/individual"
  status = 301

[[redirects]]
  from = "/service-page/sales-disc-assessment-and-debrief"
  to = "/individual"
  status = 301

[[redirects]]
  from = "/service-page/group-leadership-training-workshop"
  to = "/corporate"
  status = 301

[[redirects]]
  from = "/service-page/disc-behavorial-assessment-and-debrief-1"
  to = "/individual"
  status = 301

[[redirects]]
  from = "/service-page/group-disc-assessments-for-organizations"
  to = "/corporate"
  status = 301

[[redirects]]
  from = "/service-page/disc-workshop-4-hour-session"
  to = "/corporate"
  status = 301

[[redirects]]
  from = "/service-page/student-career-disc-assessment-debrief"
  to = "/individual"
  status = 301

[[redirects]]
  from = "/service-page/speech-coaching"
  to = "/individual"
  status = 301

[[redirects]]
  from = "/service-page/in-person-leadership-game"
  to = "/corporate"
  status = 301

# Blog functions (netlify/functions): /blog and /post/:slug are server-rendered,
# /api/blog/posts[/:slug] feed client-side navigation, /sitemap.xml tracks the
# Wix archive. Functions with a `config.path` run before the rewrite below.
# esbuild bundles each function with tree-shaking (Netlify always bundles .mts
# functions this way), so cold starts don't load whole UI libraries from disk.
# WIX_HEADLESS_CLIENT_ID must be set in the Netlify UI (Functions scope):
# variables declared in this file are not available to functions.
[functions]
  node_bundler = "esbuild"

# Static marketing pages are prerendered by scripts/prerender-static.mjs.
# Blog and post routes are handled by functions before these redirects.
[[redirects]]
  from = "/corporate"
  to = "/corporate/index.html"
  status = 200

[[redirects]]
  from = "/individual"
  to = "/individual/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

# Unknown URLs must return a real 404, including optional agent manifests
# that this site does not provide, rather than a 200 response with SPA HTML.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

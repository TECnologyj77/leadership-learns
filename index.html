<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Start Inter downloading with the HTML rather than after first render; these are the Latin files main.tsx loads. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2" />

    <!--
      Static, non-JS-visible defaults for the homepage. src/components/seo/RouteSeo.tsx
      overwrites all of this per route once React mounts (see its own comment for why
      Organization/WebSite/Person stay static here instead of moving there).

      SITE_URL below is the production origin (www.leadershiplearners.com) — see
      src/lib/site-config.ts, the source of truth for the React app. If the origin ever
      changes, keep this file's SITE_URL literals in sync.

      The route-meta markers let the blog page function (netlify/lib/html-document.ts)
      replace these defaults with server-rendered, page-specific tags. Keep them.
    -->
    <!-- route-meta:start -->
    <title>Leadership Learners | Leadership Training & Coaching</title>
    <meta
      name="description"
      content="Leadership training, group workshops, and DISC assessments for organizations, plus 1:1 coaching for individuals and neurodivergent professionals, led by Tammy Summers."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.leadershiplearners.com/" />

    <meta property="og:site_name" content="Leadership Learners" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leadership Learners | Leadership Training & Coaching" />
    <meta
      property="og:description"
      content="Leadership training, group workshops, and DISC assessments for organizations, plus 1:1 coaching for individuals and neurodivergent professionals, led by Tammy Summers."
    />
    <meta property="og:url" content="https://www.leadershiplearners.com/" />
    <meta property="og:image" content="https://www.leadershiplearners.com/og-leadership-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Leadership Learners. Build a stronger team. Speak with more confidence." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leadership Learners | Leadership Training & Coaching" />
    <meta
      name="twitter:description"
      content="Leadership training, group workshops, and DISC assessments for organizations, plus 1:1 coaching for individuals and neurodivergent professionals, led by Tammy Summers."
    />
    <meta name="twitter:image" content="https://www.leadershiplearners.com/og-leadership-v2.jpg" />
    <meta name="twitter:image:alt" content="Leadership Learners. Build a stronger team. Speak with more confidence." />
    <!-- route-meta:end -->

    <!-- Organization, WebSite and Person facts, confirmed elsewhere on the site
         (Footer/Contact for contact details, About for Tammy's role). Email keeps its
         real leadershiplearners.org address — that's the confirmed contact address,
         separate from the leadershiplearners.com site domain. No address, ratings, or
         social profiles are included — none are confirmed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.leadershiplearners.com/#organization",
            "name": "Leadership Learners",
            "url": "https://www.leadershiplearners.com/",
            "logo": "https://www.leadershiplearners.com/og-logo.jpg",
            "email": "t.summers@leadershiplearners.org",
            "telephone": "+18586036709"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.leadershiplearners.com/#website",
            "url": "https://www.leadershiplearners.com/",
            "name": "Leadership Learners",
            "publisher": { "@id": "https://www.leadershiplearners.com/#organization" }
          },
          {
            "@type": "Person",
            "@id": "https://www.leadershiplearners.com/#tammy-summers",
            "name": "Tammy Summers",
            "jobTitle": "Leadership Trainer, Coach & Business Professor",
            "worksFor": [
              { "@type": "Organization", "name": "Leadership Learners" },
              { "@type": "CollegeOrUniversity", "name": "Imperial Valley College" }
            ],
            "image": "https://www.leadershiplearners.com/og-tammy.jpg",
            "url": "https://www.leadershiplearners.com/about"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
